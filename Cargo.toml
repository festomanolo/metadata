[workspace]
resolver = "2"
members = ["crates/metadata-core", "crates/metadata-engine", "crates/metadata-forensics", "crates/metadata-cli", "crates/metadata-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
