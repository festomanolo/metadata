[package]
name = "metadata-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.61", features = ["derive", "env"] }
ctrlc = "3.5.2"
indicatif = "0.18.4"
metadata-core = { version = "0.1.0", path = "../metadata-core" }
metadata-edit = { version = "0.1.0", path = "../metadata-edit" }
metadata-engine = { version = "0.1.0", path = "../metadata-engine" }
metadata-forensics = { version = "0.1.0", path = "../metadata-forensics" }
metadata-tui = { version = "0.1.0", path = "../metadata-tui" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.1.2"
metadata-testkit = { path = "../metadata-testkit" }
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "metadata"
path = "src/main.rs"
